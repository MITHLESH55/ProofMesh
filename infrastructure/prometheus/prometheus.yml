global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'proofmesh-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
        labels:
          application: 'proofmesh-platform'
          environment: 'local'

  - job_name: 'demo-enterprise-services'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['demo-auth-service:8081', 'demo-user-service:8082', 'demo-order-service:8083']
        labels:
          application: 'proofmesh-demo-enterprise'
          environment: 'staging'
